# One-off clean-up, run by hand: deletes every published release and every version tag, so nothing points at
# history from before it was rewritten. Run the release workflow afterwards to publish the current version again.
name: scrub-old-releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete every release and tag
        run: |
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName -q '.[].tagName'); do
            echo "release $t"; gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done
          for t in $(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name'); do
            echo "tag $t"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$t" || true
          done
          echo "left: $(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' | wc -l) tags"
