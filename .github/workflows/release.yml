# Publishes a downloadable Windows build whenever the game's version goes up.
# Bump the version in CMakeLists.txt (project(... VERSION x.y.z)) and push: this builds the Windows zip, checks the
# tests pass, and puts it on the repository's Releases page as "Gunsmith3D x.y.z-stage", with the newest section of
# CHANGELOG.md as its notes. A version that already has a release is skipped, so ordinary pushes do nothing.
# Where it's published: the public repository PUBLIC_REPO below (the code stays private here), using the secret
# RELEASES_TOKEN (a token allowed to write to that repository). Without the secret it publishes here instead.
# The game's updater (src/app/updater.hpp, update::REPO) looks at the newest release in PUBLIC_REPO.
name: release

on:
  push:
    paths: [CMakeLists.txt, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-zip:
    runs-on: ubuntu-24.04
    env:
      PUBLIC_REPO: LusciousLuchs/Gunsmith3D-Releases
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: Which version
        id: v
        run: |
          if [ -n "$RELEASES_TOKEN" ]; then repo="$PUBLIC_REPO"; tok="$RELEASES_TOKEN"; else repo="$GITHUB_REPOSITORY"; tok="${{ github.token }}"; fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "GH_TOKEN=$tok" >> "$GITHUB_ENV"
          echo "Publishing to $repo"
          v=$(sed -n 's/^project(Gunsmith3D VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          stage=$(sed -n 's/^set(GUNSMITH_STAGE "\([a-z]*\)".*/\1/p' CMakeLists.txt)
          full="$v${stage:+-$stage}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          if GH_TOKEN="$tok" gh release view "v$full" --repo "$repo" >/dev/null 2>&1; then
            echo "v$full is already released: nothing to do."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests (the physics core, on Linux)
        if: steps.v.outputs.skip != '1'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/gunsmith3d_tests

      - name: Windows build (MinGW-w64)
        if: steps.v.outputs.skip != '1'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q g++-mingw-w64-x86-64-posix
          cmake -S . -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-gcc.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j --target gunsmith3d

      - name: Zip
        if: steps.v.outputs.skip != '1'
        run: |
          d="Gunsmith3D-${{ steps.v.outputs.full }}"
          mkdir "$d"
          cp build-win/gunsmith3d.exe README.md CHANGELOG.md BACKLOG.md "$d"/
          cp -r licenses dist/user "$d"/
          zip -qr "$d.zip" "$d"
          # the release notes: the changelog's newest section
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md

      - name: Publish the release
        if: steps.v.outputs.skip != '1'
        run: |
          target=""
          [ "${{ steps.v.outputs.repo }}" = "$GITHUB_REPOSITORY" ] && target="--target $GITHUB_SHA"
          gh release create "v${{ steps.v.outputs.full }}" "Gunsmith3D-${{ steps.v.outputs.full }}.zip" \
            --repo "${{ steps.v.outputs.repo }}" $target --title "Gunsmith3D ${{ steps.v.outputs.full }}" --notes-file notes.md --latest

      # Posts the same notes in the game's Discord server. Needs the secret DISCORD_WEBHOOK (a channel's webhook URL:
      # in Discord, Edit Channel > Integrations > Webhooks > New Webhook > Copy Webhook URL). Without it, skipped.
      - name: Tell the Discord server
        if: steps.v.outputs.skip != '1' && env.DISCORD_WEBHOOK != ''
        continue-on-error: true
        run: |
          url="https://github.com/${{ steps.v.outputs.repo }}/releases/tag/v${{ steps.v.outputs.full }}"
          # Discord shows "### Heading" poorly inside a card: make headings bold; a card holds 4096 characters
          sed -E 's/^#{1,6} +(.*)$/**\1**/' notes.md > discord.md
          jq -n --rawfile notes discord.md --arg url "$url" --arg title "Gunsmith3D ${{ steps.v.outputs.full }} is out" '
            ($notes | sub("^\\s+"; "") | sub("\\s+$"; "") | if length > 3900 then .[0:3900] + "\n… (the rest is on the download page)" else . end) as $d
            | {username: "Gunsmith3D", allowed_mentions: {parse: []},
               embeds: [{title: $title, url: $url, description: $d, color: 15105570,
                         footer: {text: "The game updates itself, or download it from the link above."}}]}' > discord.json
          curl -sS --fail-with-body -H "Content-Type: application/json" -d @discord.json "$DISCORD_WEBHOOK"
